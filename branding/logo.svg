<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Icon tile: 140x140, positioned left with 30px padding -->
  <g transform="translate(30, 30)">
    <rect width="140" height="140" rx="31" fill="url(#bg)"/>
    <g transform="scale(0.7)">
      <!-- Tick marks -->
      <g stroke="#475569" stroke-width="3" stroke-linecap="round">
        <line x1="48.04" y1="130" x2="41.12" y2="134"/>
        <line x1="48.04" y1="70" x2="41.12" y2="66"/>
        <line x1="100" y1="40" x2="100" y2="32"/>
        <line x1="151.96" y1="70" x2="158.88" y2="66"/>
        <line x1="151.96" y1="130" x2="158.88" y2="134"/>
      </g>
      <path d="M 48.04 130 A 60 60 0 1 1 151.96 130"
            fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
      <path d="M 48.04 130 A 60 60 0 0 1 115.53 42.04"
            fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
      <line x1="100" y1="100" x2="112.94" y2="51.70"
            stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="9" fill="#f8fafc"/>
      <circle cx="100" cy="100" r="4" fill="#0f172a"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="200" y="108" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#0f172a">Bouncie</text>
  <text x="200" y="155" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#475569" letter-spacing="2">COPILOT</text>
</svg>
